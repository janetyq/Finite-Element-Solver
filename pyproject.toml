[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "finite-element-solver"
version = "0.1.0"
description = "A finite element method solver for 2D/3D PDEs, with custom meshing, adaptive refinement, and topology optimization."
readme = "README.md"
requires-python = ">=3.10"
# Abstract (unpinned) runtime deps: what the library needs to import and run.
# Reproducible, pinned versions for development live in uv.lock.
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    # AMG-preconditioned CG for large SPD systems (fem.algebra.backends.IterativeBackend), the
    # solver's answer to 3D factorization fill-in. Base, not an extra: it needs only
    # numpy/scipy (already here), so it adds no transitive weight, and it is the core
    # scaling path rather than a niche feature.
    "pyamg",
    # SVG-outline meshing (fem.mesh.svg). Base rather than an extra: it is 13 files of
    # pure Python with no dependencies of its own, so gating it bought nothing and cost
    # a skipped test plus two demos that could not run on a default install.
    "svg.path",
]

# Development tooling (installed by default with `uv sync`)
[dependency-groups]
# pygments highlights the gallery's source listings (examples/source_html.py).
# pytest-cov reports library coverage in CI; hypothesis drives the property tests
# (tests/test_properties.py); pytest-randomly shuffles test order to surface any
# ordering dependence between the module-scoped fixtures; diff-cover gates a PR on
# the coverage of the lines it changed.
dev = ["pytest", "ruff", "pyright", "pygments", "pytest-cov", "hypothesis", "pytest-randomly", "diff-cover"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pyflakes (F) catches real problems (unused imports, undefined names); the
# E4/E7/E9 subset covers import/statement/runtime errors without line-length noise.
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["fem", "examples", "benchmarks"]
pythonVersion = "3.11"
# "basic" infers types for the unannotated internals rather than demanding
# annotations everywhere, so the checker is useful while only the public API is
# typed. Tighten toward "standard" as coverage grows.
typeCheckingMode = "basic"
# svg.path and matplotlib ship partial or no stubs; missing-import noise from them
# would drown out real findings.
reportMissingTypeStubs = false

[tool.setuptools.packages.find]
include = ["fem*"]

[tool.pytest.ini_options]
# The package is installed (pip install -e .), so tests import `fem` directly;
# no sys.path shim needed.
testpaths = ["tests"]

[tool.coverage.run]
# Coverage tracks the library. The demos and MMS studies under examples/ are
# exercised through the demo and convergence tests but are not the code under test.
source = ["fem"]

[tool.coverage.report]
show_missing = true
